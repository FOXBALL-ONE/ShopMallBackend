name: Build and Release

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            AdminPanelUI/package-lock.json

      - name: Build backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon
          cp build/libs/*.jar backend.jar

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          cd .output
          tar -czf ../../frontend.tar.gz .

      - name: Build admin panel
        working-directory: ./AdminPanelUI
        run: |
          npm ci
          npm run build
          cd .output
          tar -czf ../../admin.tar.gz .

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: latest-${{ steps.vars.outputs.sha_short }}
          release_name: Latest Build (${{ steps.vars.outputs.sha_short }})
          draft: false
          prerelease: false

      - name: Upload backend.jar
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./backend.jar
          asset_name: backend.jar
          asset_content_type: application/java-archive

      - name: Upload frontend.tar.gz
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./frontend.tar.gz
          asset_name: frontend.tar.gz
          asset_content_type: application/gzip

      - name: Upload admin.tar.gz
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./admin.tar.gz
          asset_name: admin.tar.gz
          asset_content_type: application/gzip

      - name: Update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest
