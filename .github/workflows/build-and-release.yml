name: Build and Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            AdminPanelUI/package-lock.json

      - name: Build backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon
          cp build/libs/*.jar backend.jar

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build
          cd .output
          tar -czf ../../frontend.tar.gz .

      - name: Build admin panel
        working-directory: ./AdminPanelUI
        run: |
          npm ci
          npm run build
          cd .output
          tar -czf ../../admin.tar.gz .

      - name: Get short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (${{ steps.vars.outputs.sha_short }})
          files: |
            backend.jar
            frontend.tar.gz
            admin.tar.gz
          draft: false
          prerelease: false
