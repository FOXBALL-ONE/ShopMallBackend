# 测试配置：使用内存数据库，并禁用启动时 Redis 清理，避免依赖或影响本机服务。
spring:
  datasource:
    url: "jdbc:h2:mem:shopmall;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

redis:
  clear-on-startup: false

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

shopmall:
  order:
    payment-timeout-minutes: 1
    idempotency-ttl-seconds: 60
    stream-max-len: 100
    outbox-max-attempts: 3
    outbox-ack-sla-seconds: 30
    outbox-retention-days: 1
    max-quantity-per-line: 99
  logistics:
    polling-enabled: false

stripe:
  secret-key: "sk_test_placeholder"
  webhook-secret: "whsec_test_placeholder"
